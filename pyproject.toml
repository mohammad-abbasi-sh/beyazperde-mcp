[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beyazperde-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for Beyazperde (beyazperde.com): now showing, movie search, details, showtimes, news, cities"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "httpx>=0.27",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
beyazperde-mcp = "beyazperde_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/beyazperde_mcp"]
